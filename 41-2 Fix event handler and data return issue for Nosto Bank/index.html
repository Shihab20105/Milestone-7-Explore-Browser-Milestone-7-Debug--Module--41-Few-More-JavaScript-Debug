<!DOCTYPE html>
<html lang="en">

<head>

   <meta charset="UTF-8" />

   <meta http-equiv="X-UA-Compatible" content="IE=edge" />

   <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
   />

   <title>Fix event handler and data return issue for Nosto Bank</title>


   <!-- Custom CSS -->

   <link
      rel="stylesheet"
      href="./css/style.css"
   />


   <!-- Bootstrap CSS -->

   <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
      crossorigin="anonymous"
   />


   <!-- Bootstrap Icons -->

   <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
   />


   <!-- Google Montserrat Font -->

   <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
   />

   <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
   />

   <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
   />

</head>


<body>


   <!-- Header / Search -->

   <header>
      <h6>41-2 Fix event handler and data return issue for Nosto Bank</h6>
      <div class="row my-5 justify-content-center">

         <div class="col-md-5">

            <div class="input-group mb-3">

               <input
                  type="text"
                  class="form-control"
                  placeholder="Search products"
                  aria-label="Search Products"
                  aria-describedby="basic-addon2"
                  id="input-value"
               />


               <button
                  type="button"
                  class="input-group-text px-4 bg-success"
                  id="search-btn"
               >

                  <i
                     class="bi bi-search text-white fw-bold"
                  ></i>

               </button>

            </div>

         </div>

      </div>

   </header>


   <!-- Main -->

   <main class="main">


      <!-- Total Products -->

      <div class="my-5">

         <h2 class="text-center">

            Total Products:

            <span
               class="text-success"
               id="total_products"
            >
               0
            </span>

         </h2>

      </div>


      <div class="row">


         <!-- Products -->

         <div class="col-md-9 col-lg-9 col-sm-7">

            <div id="all-products">

               <h1></h1>

            </div>

         </div>


         <!-- Cart -->

         <div class="col-md-3 col-lg-3 col-sm-5 cart-main">

            <div
               class="cart"
               id="my-cart"
            >


               <h1
                  class="text-center text-white bg-success py-1 rounded"
               >

                  My-Cart

                  <i class="bi bi-cart4"></i>

               </h1>


               <table class="table">

                  <thead>

                     <tr>

                        <th scope="col"></th>

                        <th scope="col"></th>

                        <th scope="col"></th>

                        <th scope="col"></th>

                     </tr>

                  </thead>


                  <tbody>


                     <!-- Product Count -->

                     <tr>

                        <th>
                           Total Added-Products:
                        </th>

                        <td>
                           <span id="total-Products">0</span>
                        </td>

                        <td></td>

                        <td></td>

                     </tr>


                     <!-- Price -->

                     <tr>

                        <th>
                           Price:
                        </th>

                        <td>
                           $ <span id="price">0</span>
                        </td>

                        <td></td>

                        <td></td>

                     </tr>


                     <!-- Delivery -->

                     <tr>

                        <th>
                           Delivery-Charge:
                        </th>

                        <td>
                           $ <span id="delivery-charge">20</span>
                        </td>

                        <td></td>

                        <td></td>

                     </tr>


                     <!-- Tax -->

                     <tr>

                        <th>
                           Total-Tax:
                        </th>

                        <td>
                           $ <span id="total-tax">0</span>
                        </td>

                        <td></td>

                        <td></td>

                     </tr>


                     <!-- Total -->

                     <tr>

                        <th scope="row">
                           Total
                        </th>

                        <td colspan="2">
                           $ <span id="total">20</span>
                        </td>

                        <td></td>

                     </tr>


                  </tbody>

               </table>


               <div class="parces text-center">

                  <button
                     type="button"
                     class="btn btn-success text-center"
                  >
                     Buy Now
                  </button>

               </div>


            </div>

         </div>

      </div>

   </main>


   <footer></footer>



   <!-- ============================= -->
   <!-- Modal -->
   <!-- ============================= -->

   <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
   >

      <div class="modal-dialog">

         <div class="modal-content">


            <!-- Modal Header -->

            <div class="modal-header">

               <h5
                  class="modal-title text-success"
                  id="exampleModalLabel"
               >
                  Product Details
               </h5>


               <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
               ></button>

            </div>


            <!-- Product ID -->

            <div class="ms-3 my-3">

               <strong>

                  Product id:

                  <span id="productId"></span>

               </strong>

            </div>


            <!-- Description -->

            <div
               class="modal-body text-secondary"
               id="modal_body"
            ></div>


            <!-- Rating -->

            <div class="p-4 d-flex">

               <strong class="me-2">
                  Rating
               </strong>


               <span
                  id="rating"
                  class="text-white p-2 circle"
               ></span>

            </div>


            <!-- Footer -->

            <div class="modal-footer">

               <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
               >
                  Close
               </button>

            </div>


         </div>

      </div>

   </div>



   <!-- Bootstrap JavaScript -->

   <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
   ></script>


   <!-- Custom JavaScript -->

   <script src="./js/app.js"></script>


</body>

</html>
